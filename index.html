<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기 게임</title>
  <style>
    :root {
      --bg-color: #e0f2fe;
      --card-bg: #ffffff;
      --primary-color: #10b981;
      --accent-color: #ef4444;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 1.8rem;
      color: #0f172a;
    }

    .dashboard {
      display: flex;
      justify-content: space-around;
      background-color: #f1f5f9;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .dash-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dash-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .dash-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* 3x3 구멍 그리드 레이아웃 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .hole {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 비율 유지 */
      background: linear-gradient(180deg, #854d0e 0%, #713f12 100%);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .mole-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mole {
      position: absolute;
      width: 80%;
      height: 80%;
      bottom: -80%;
      transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mole.up {
      bottom: 5%;
    }

    .mole-svg {
      width: 100%;
      height: 100%;
    }

    /* 버튼 스타일 */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
    }

    .btn:hover {
      background-color: #059669;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* 점수 획득 애니메이션 */
    .score-popup {
      position: absolute;
      font-weight: bold;
      font-size: 1.2rem;
      animation: popup 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes popup {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(1.3); }
    }

    /* 모달 레이어 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 32px;
      border-radius: 20px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }

    .modal h2 {
      margin-top: 0;
      color: #0f172a;
    }

    .modal p {
      font-size: 1.1rem;
      color: #475569;
    }

    /* 터치 단말 대응 망치 효과 Cursor */
    .hole:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>🔨 두더지 잡기</h1>

    <div class="dashboard">
      <div class="dash-item">
        <span class="dash-label">점수</span>
        <span class="dash-value" id="score">0</span>
      </div>
      <div class="dash-item">
        <span class="dash-label">남은 시간</span>
        <span class="dash-value" id="time">30</span>
      </div>
      <div class="dash-item">
        <span class="dash-label">최고 기록</span>
        <span class="dash-value" id="high-score">0</span>
      </div>
    </div>

    <div class="grid">
      <!-- 9개의 구멍 생성 -->
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
      <div class="hole"><div class="mole-wrapper"><div class="mole"></div></div></div>
    </div>

    <button class="btn" id="start-btn">게임 시작</button>
  </div>

  <!-- 결과 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>게임 종료!</h2>
      <p>최종 점수: <span id="final-score" style="font-weight:bold; color:#10b981;">0</span>점</p>
      <button class="btn" id="restart-btn">다시 하기</button>
    </div>
  </div>

  <script>
    // SVG 두더지 및 폭탄 캐릭터 디자인
    const moleSVG = `
      <svg class="mole-svg" viewBox="0 0 100 100">
        <path d="M 20 80 A 30 40 0 0 1 80 80 Z" fill="#8B5E3C" />
        <ellipse cx="50" cy="45" rx="35" ry="30" fill="#A0522D" />
        <ellipse cx="50" cy="55" rx="20" ry="15" fill="#D2B48C" />
        <!-- 눈 -->
        <circle cx="38" cy="40" r="4" fill="#000" />
        <circle cx="62" cy="40" r="4" fill="#000" />
        <circle cx="40" cy="38" r="1.5" fill="#FFF" />
        <circle cx="64" cy="38" r="1.5" fill="#FFF" />
        <!-- 코 -->
        <ellipse cx="50" cy="48" rx="6" ry="4" fill="#FFC0CB" />
      </svg>
    `;

    const bombSVG = `
      <svg class="mole-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="30" fill="#1E293B" />
        <path d="M 50 25 Q 60 15 70 20" stroke="#8B5E3C" stroke-width="4" fill="none" />
        <!-- 불꽃 -->
        <circle cx="70" cy="20" r="5" fill="#EF4444" />
        <!-- 해골 눈 -->
        <circle cx="40" cy="50" r="4" fill="#FFF" />
        <circle cx="60" cy="50" r="4" fill="#FFF" />
      </svg>
    `;

    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreBoard = document.getElementById('score');
    const timeBoard = document.getElementById('time');
    const highScoreBoard = document.getElementById('high-score');
    const startBtn = document.getElementById('start-btn');
    const modal = document.getElementById('modal');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let timeLeft = 30;
    let timer;
    let gameLoopTimeout;
    let highScore = 0;

    // Web Audio API를 활용한 이펙트 소리 생성
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 랜덤 시간 계산 (두더지가 올라오는 시간)
    function randomTime(min, max) {
      return Math.round(Math.random() * (max - min) + min);
    }

    // 무작위 구멍 선택
    function randomHole(holes) {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) {
        return randomHole(holes);
      }
      lastHole = hole;
      return hole;
    }

    // 두더지/폭탄 등판 이벤트
    function peep() {
      const time = randomTime(500, 1000);
      const hole = randomHole(holes);
      const mole = hole.querySelector('.mole');

      // 20% 확률로 폭탄 출현
      const isBomb = Math.random() < 0.2;
      mole.innerHTML = isBomb ? bombSVG : moleSVG;
      mole.dataset.type = isBomb ? 'bomb' : 'mole';

      mole.classList.add('up');

      gameLoopTimeout = setTimeout(() => {
        mole.classList.remove('up');
        if (!timeUp) peep();
      }, time);
    }

    // 게임 시작 함수
    function startGame() {
      // 초기화
      score = 0;
      timeLeft = 30;
      timeUp = false;
      scoreBoard.textContent = 0;
      timeBoard.textContent = timeLeft;
      startBtn.disabled = true;
      modal.classList.remove('active');

      peep();

      // 카운트다운 타이머
      timer = setInterval(() => {
        timeLeft--;
        timeBoard.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timeUp = true;
          clearTimeout(gameLoopTimeout);
          endGame();
        }
      }, 1000);
    }

    // 게임 종료
    function endGame() {
      startBtn.disabled = false;
      finalScore.textContent = score;

      if (score > highScore) {
        highScore = score;
        highScoreBoard.textContent = highScore;
      }

      modal.classList.add('active');
    }

    // 두더지 클릭/터치 이벤트 처리
    function bonk(e) {
      const mole = e.currentTarget.querySelector('.mole');
      
      // 주작 클릭 방지 및 올라와있는 상태 확인
      if (!e.isTrusted || !mole.classList.contains('up')) return;

      const type = mole.dataset.type;
      const rect = mole.getBoundingClientRect();

      mole.classList.remove('up');

      if (type === 'mole') {
        score += 10;
        playSound('hit');
        showScorePopup('+10', rect.left + rect.width / 2, rect.top, '#10b981');
      } else if (type === 'bomb') {
        score = Math.max(0, score - 15);
        playSound('bomb');
        showScorePopup('-15', rect.left + rect.width / 2, rect.top, '#ef4444');
      }

      scoreBoard.textContent = score;
    }

    // 화면 점수 팝업 애니메이션
    function showScorePopup(text, x, y, color) {
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = text;
      popup.style.color = color;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      document.body.appendChild(popup);

      setTimeout(() => {
        popup.remove();
      }, 600);
    }

    // 이벤트 리스너 등록
    holes.forEach(hole => {
      hole.addEventListener('pointerdown', bonk);
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
